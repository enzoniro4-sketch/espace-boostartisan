@font-face{font-family:'Inter';font-style:normal;font-weight:400 700;font-display:swap;src:url(/polices/inter-v1.woff2) format('woff2')}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:700;font-display:swap;src:url(/polices/space-grotesk-700-v1.woff2) format('woff2')}
:root{--t-bg:#F4F5F7;--t-card:#FFFFFF;--t-ink:#101828;--t-ink2:#1D2939;--t-mute:#475467;--t-soft:#C8D0DC;--t-chip:#EEF2F6;--t-blue:#1849A9;--t-blue2:#123A87;--t-bluetx:#E3EAF7;--t-bluebg:#EFF4FF;--t-green:#067647;--t-greenbg:#DCFAE6;--t-greentx:#085D3A;--t-dot:#47CD89;--t-amber:#FEF0C7;--t-ambertx:#93370D;--t-red:#B42318;--t-redbg:#FEE4E2;--t-sk:#E4E7EC;--t-skd:#344054;--t-white:#FFFFFF;--t-edge:#D0D5DD;--t-line:#EAECF0;--disp:'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--t-bg);color:var(--t-ink);font:400 14.5px/1.5 var(--body)}

button,input,textarea{font:inherit;color:inherit}

[hidden]{display:none!important}
[data-z]{display:contents}
.tel{width:100%;max-width:480px;margin:0 auto;min-height:100vh;background:var(--t-bg);color:var(--t-ink)}
.hors{background:var(--t-amber);color:var(--t-ambertx);font:600 12px/1.4 var(--body);padding:9.5px 17px;padding-top:max(9.5px,env(safe-area-inset-top,0px));max-width:480px;margin:0 auto}
.essai{position:sticky;top:0;z-index:5;background:#B54708;color:var(--t-white);font:700 11.5px/1.35 var(--body);text-align:center;padding:7px 10px}
.tete{background:var(--t-ink);color:var(--t-white);padding:24px 17px 17px;display:flex;flex-direction:column;gap:13.5px}
.tete small{font:500 11.5px/1.4 var(--body);color:var(--t-soft);display:block}
.tete b{font:700 22px/1.2 var(--disp);display:block;overflow-wrap:anywhere}

.etat{display:flex;align-items:center;gap:10px;background:var(--t-ink2);border-radius:12px;padding:10px 12px;text-decoration:none;color:inherit}

.etat.vide i{background:var(--t-skd)}
.etat.ko i{background:#F97066}

.frais{display:flex;align-items:center;gap:7px;font:500 11.5px/1.4 var(--body);color:var(--t-soft)}

.haut h1{font:700 24px/1.15 var(--disp);overflow-wrap:anywhere}

.corps{padding:13.5px 13.5px 27px;display:flex;flex-direction:column;gap:10px}
.carte{background:var(--t-card);border-radius:13.5px;padding:15.5px;display:flex;flex-direction:column;gap:10px;min-width:0}
